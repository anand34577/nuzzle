<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose area</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; cursor: crosshair;
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; }
  #dim { position: fixed; inset: 0; background: rgba(12,14,18,.55); }
  #sel { position: fixed; border: 2px solid #6ea1ff; background: transparent; box-shadow: 0 0 0 100vmax rgba(12,14,18,.55); }
  #sel[hidden], #dim[hidden] { display: none; }
  #size { position: absolute; left: 0; top: -26px; padding: 2px 8px; border-radius: 6px; background: #6ea1ff; color: #0d1320; font-weight: 600; font-size: 12px; white-space: nowrap; }
  #panel { position: fixed; left: 50%; top: 28px; transform: translateX(-50%); display: grid; gap: 10px; justify-items: center; padding: 14px 18px; border-radius: 10px; background: #1d2026; border: 1px solid #3a3e47; cursor: default; max-width: calc(100vw - 32px); }
  #hint { text-align: center; }
  #hint b { background: #2d3139; border: 1px solid #454a55; border-radius: 5px; padding: 0 6px; font-weight: 600; }
  #err { color: #ff8c9b; font-weight: 600; min-height: 1.4em; text-align: center; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { min-height: 34px; padding: 6px 14px; border: 1px solid #454a55; border-radius: 8px; background: #2d3139; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { background: #3a3e47; }
  button.primary { background: #4a7de0; border-color: #4a7de0; }
  button.primary:hover:not(:disabled) { background: #3f6fcf; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
</style>
</head>
<body>
  <div id="dim"></div>
  <div id="sel" hidden><span id="size"></span></div>
  <div id="panel">
    <div id="hint">Drag to draw the area where I may wander. Press <b>Enter</b> to confirm or <b>Esc</b> to cancel.</div>
    <div id="err" role="alert"></div>
    <div class="row">
      <button id="ok" class="primary" disabled>Use this area</button>
      <button id="cancel">Cancel</button>
    </div>
  </div>
<script src="area.js"></script>
</body>
</html>
