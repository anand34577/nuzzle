name: Build Companion

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never
  # System libraries Tauri, audio (cpal), screen capture (xcap), input (enigo) and the keyring need on Linux.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev
    libdbus-1-dev libxcb1-dev libxrandr-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

# A newer push to the same branch cancels the older run; tag builds are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      # build.rs checks that the bundled resources exist, so even clippy and tests need llama.cpp in place.
      - name: Fetch pinned llama.cpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-llama.mjs --force
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

  # Runs in parallel with `test`, so a release doesn't wait for a second cold compile.
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: companion-windows-x64
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            name: companion-linux-x64
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: ubuntu-22.04-arm
            name: companion-linux-arm64
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-14
            name: companion-macos-arm64
            files: |
              src-tauri/target/release/bundle/dmg/*.dmg
          # Intel Macs: cross-built on the Apple-silicon runner, with the x64 llama.cpp bundled.
          - os: macos-14
            name: companion-macos-x64
            target: x86_64-apple-darwin
            llama_arch: x64
            files: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: ${{ matrix.name }}
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      # The llama.cpp version is pinned in llama.cpp.version and verified against llama.cpp.sha256[.<platform>].
      # To upgrade: change the version and every checksum file in one commit (see README, "Updating llama.cpp").
      - name: Fetch pinned llama.cpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMA_ARCH: ${{ matrix.llama_arch }}
        run: node scripts/fetch-llama.mjs --force

      - run: npm ci
      - name: Build installer (llama.cpp is bundled as an app resource)
        shell: bash
        run: npx tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    # Runs only for version tags (git tag v0.1.0 && git push --tags); publishes every installer to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: dist
      - name: Flatten and write checksums
        working-directory: dist
        run: |
          find . -mindepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Companion $GITHUB_REF_NAME" --generate-notes
